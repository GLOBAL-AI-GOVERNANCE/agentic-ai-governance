# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-governance"
version = "0.1.0a5"
description = "Reference Agent Trust Passport validator for Agentic AI Governance (experimental alpha; verification is not authorization)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
dependencies = [
  "jsonschema>=4.26.0,<5",
  "cryptography>=50.0.1",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.urls]
Repository = "https://github.com/GLOBAL-AI-GOVERNANCE/agentic-ai-governance"

[project.scripts]
validate-passport = "agentic_ai_governance.cli:main"
issue-passports = "agentic_ai_governance.runners:issue_passports_main"
lead-agent = "agentic_ai_governance.runners:lead_agent_main"

[tool.setuptools]
packages = ["agentic_ai_governance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
