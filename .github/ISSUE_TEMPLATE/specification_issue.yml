name: Specification issue
description: Report ambiguity, inconsistency, or missing normative behavior.
title: "[Spec]: "
labels: ["specification"]
body:
  - type: input
    id: section
    attributes:
      label: Normative section
      placeholder: spec/06-signature-profile.md#protected-header
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the ambiguity or contradiction and its interoperability impact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction or evidence
    validations:
      required: true
