name: Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build. Manual runs keep the output as a workflow artifact and do not change any release."
        required: true

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Build source archive from the tag
        shell: bash
        run: |
          set -euo pipefail
          name="agentic-ai-governance-${TAG}"
          mkdir -p "$RUNNER_TEMP/dist"
          # git archive stamps every entry with the tag commit time, so the archive
          # does not depend on the build machine's clock, zone, or file system.
          git archive --format=zip --prefix="${name}/" -o "$RUNNER_TEMP/dist/${name}.zip" HEAD
          cd "$RUNNER_TEMP/dist"
          sha256sum -- "${name}.zip" > "${name}.zip.sha256"
          sha256sum -- "${name}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Check build output against SHA256SUMS.txt
        shell: bash
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Attest build provenance for the release archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

  attach:
    needs: [build, attest]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Attach assets to the new release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          gh release view "$TAG" > /dev/null
          # No --clobber: an asset that already exists is never replaced.
          gh release upload "$TAG" dist/*
