name: Conformance

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out shared history-privacy control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GLOBAL-AI-GOVERNANCE/.github
          ref: 201113e1fdf92892ab8864abe8ae446bb2a9109b
          path: .gaig-shared-controls
          sparse-checkout: tools/check_history_privacy.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check reachable history privacy
        run: python -B .gaig-shared-controls/tools/check_history_privacy.py
      - name: Remove shared history-privacy control
        if: always()
        run: rm -rf -- .gaig-shared-controls
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Set up OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.19.1
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python tools/build_dist.py --check
      - run: python tools/verify_repository.py .
      - name: Validate signed passport trust decision
        run: >-
          python tools/validate_artifact.py
          --kind passport
          --trusted-key examples/trusted-keys/test-ed25519-key.json
          --revocation-list examples/revocation/valid-revocation-list.json
          --bundle-manifest examples/bundles/valid-bundle-manifest.json
          --bundle-root .
          --at-time 2026-07-18T12:00:00Z
          examples/passports/signed-unrevoked.json
      - run: python -m pip check
      - name: Audit Python dependencies
        run: python -m pip_audit --strict -r requirements-dev.txt
      - run: python -m compileall -q tools tests
      - name: Check schema $id offline
        run: python tools/check_schema_ids.py
      - name: Check schema $id live resolution
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python tools/check_schema_ids.py --online
      - name: Validate OPA bridge policy and examples
        run: |
          opa fmt --fail policies/opa
          opa test policies/opa -v
          test "$(opa eval --format raw --data policies/opa/bridge.rego --input examples/opa/permitted-read.json 'data.agentic.opa_bridge.decision.operating_disposition')" = "PERMITTED"
          test "$(opa eval --format raw --data policies/opa/bridge.rego --input examples/opa/policy-denied-read.json 'data.agentic.opa_bridge.decision.operating_disposition')" = "NOT_PERMITTED"
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the sdist, wheel, and release-style source archive
        run: |
          python -m pip install --disable-pip-version-check build==1.6.1
          python -m build --sdist --wheel --outdir "$RUNNER_TEMP/dist" .
          git archive --format=zip --prefix=agentic-ai-governance-ci/ -o "$RUNNER_TEMP/dist/agentic-ai-governance-ci.zip" HEAD
          ls -l "$RUNNER_TEMP/dist"
      - name: Install each archive into a clean environment and validate example passports
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          check() {
            env="$RUNNER_TEMP/env-$1"
            python -m venv "$env"
            "$env/bin/python" -m pip install --disable-pip-version-check "$2"
            "$env/bin/python" -m pip check
            "$env/bin/validate-passport" --example signed-unrevoked > "unrevoked-$1.json"
            python -c "import json, sys; r = json.load(open(sys.argv[1])); assert r['artifact_validation_status'] == 'PASS', r" "unrevoked-$1.json"
            if "$env/bin/validate-passport" --example signed-revoked > "revoked-$1.json"; then
              echo "revoked example must fail ($1)" >&2; exit 1
            fi
            python -c "import json, sys; r = json.load(open(sys.argv[1])); assert r['verification_primary_status'] == 'REVOKED', r" "revoked-$1.json"
            "$env/bin/python" -c "import agentic_ai_governance as a; assert a.reference_root().name == '_reference'"
            echo "$1: PASS"
          }
          check wheel "$(ls "$RUNNER_TEMP"/dist/*.whl)"
          check sdist "$(ls "$RUNNER_TEMP"/dist/*.tar.gz)"
          check archive "$RUNNER_TEMP/dist/agentic-ai-governance-ci.zip"
