name: Conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python tools/build_dist.py --check
      - run: python tools/verify_repository.py .
      - name: Validate signed passport trust decision
        run: >-
          python tools/validate_artifact.py
          --kind passport
          --trusted-key examples/trusted-keys/test-ed25519-key.json
          --revocation-list examples/revocation/valid-revocation-list.json
          --bundle-manifest examples/bundles/valid-bundle-manifest.json
          --bundle-root .
          --at-time 2026-07-18T12:00:00Z
          examples/passports/signed-unrevoked.json
      - run: python -m pip check
      - name: Audit Python dependencies
        run: python -m pip_audit --strict -r requirements-dev.txt
      - run: python -m compileall -q tools tests
      - run: pytest -q
